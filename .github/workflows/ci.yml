# Continuous integration for the skeleton.
# contents: read is the only permission. The workflow does not receive
# repository credentials, does not merge, and does not publish an image.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.3"
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Install pinned FFmpeg
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5
          ffprobe -version
      - name: Format, lint, types, unit tests, secret scan
        run: |
          .venv/bin/ruff format --check services workers/media packages/protocol tests scripts
          .venv/bin/ruff check services workers/media packages/protocol tests scripts
          .venv/bin/mypy
          .venv/bin/python scripts/workflow_policy.py
          .venv/bin/python scripts/scan_secrets.py
          .venv/bin/python scripts/write_sbom.py --check
          .venv/bin/python scripts/run_tests.py --only python

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
      - name: Install, type-check, and test
        run: |
          npm ci
          npm run typecheck
          python3 scripts/run_tests.py --only node

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install protoc
        run: bash scripts/install_toolchains.sh --protoc-only
      # services/broadcaster's tests start a disposable PostgreSQL 18.6
      # cluster from /usr/lib/postgresql/18/bin (internal/pgtest), and no
      # variable skips them. This step installs the goal 04 pin of
      # docs/dependencies.md from apt.postgresql.org after checking the
      # signing key fingerprint, falls back to apt-archive.postgresql.org for
      # the same version when the main suite no longer lists it, and
      # otherwise fails. policy-rc.d keeps the package from starting a
      # cluster. tests/unit/test_ci_broadcaster.py fails if a job runs the
      # module's tests without this step, or if the copies of it differ.
      - name: Install PostgreSQL 18.6
        run: |
          set -euo pipefail
          pg_ver="18.6-1.pgdg24.04+2"
          pg_fpr="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "${key}" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --batch --show-keys --with-colons "${key}" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "${fpr}" != "${pg_fpr}" ]; then
            echo "PostgreSQL apt key fingerprint ${fpr} is not ${pg_fpr}"
            exit 1
          fi
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "${f}" ] && grep -q 'apt.postgresql.org' "${f}"; then
              sudo rm -f "${f}"
            fi
          done
          write_source() {
            printf '%s\n' 'Types: deb' "URIs: $2" "Suites: $3" 'Architectures: amd64' \
              'Components: main' "Signed-By: ${key}" | sudo tee "/etc/apt/sources.list.d/$1.sources" >/dev/null
          }
          has_pin() {
            local found
            found="$(apt-cache madison postgresql-18)"
            awk -F'|' -v want="${pg_ver}" '{ gsub(/[[:space:]]/, "", $2); if ($2 == want) hit = 1 } END { exit hit ? 0 : 1 }' <<<"${found}"
          }
          write_source pgdg https://apt.postgresql.org/pub/repos/apt noble-pgdg
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          if ! has_pin; then
            echo "apt.postgresql.org no longer lists postgresql-18 ${pg_ver}; trying apt-archive.postgresql.org"
            write_source pgdg-archive https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
            if ! has_pin; then
              echo "postgresql-18 ${pg_ver} is in neither PGDG archive; update the pin in docs/dependencies.md, scripts/env/install.sh and this workflow"
              exit 1
            fi
          fi
          created_policy=0
          if [ ! -e /usr/sbin/policy-rc.d ]; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            created_policy=1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "postgresql-18=${pg_ver}" "postgresql-client-18=${pg_ver}"
          if [ "${created_policy}" = 1 ]; then
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          installed="$(dpkg-query -W -f '${Version}' postgresql-18)"
          if [ "${installed}" != "${pg_ver}" ]; then
            echo "installed postgresql-18 ${installed}, want ${pg_ver}"
            exit 1
          fi
          /usr/lib/postgresql/18/bin/postgres --version
      - name: Install pinned FFmpeg
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5
          ffprobe -version
      # SVN_SKIP_DEVNET=1 skips the multi-process chain/devnet tests in this
      # job. Without -race they take about 9.5 minutes, plus up to about 6.5
      # minutes when TestDevnetAuditLifecycle waits for an audit round
      # boundary, plus the Goal 10 upgrade rehearsal, which can reach the
      # 20-minute job cap, and they would only repeat the go-race "devnet",
      # "devnet-evidence", "devnet-upgrade", "devnet-broadcaster", and
      # "devnet-broadcaster-stall" shards, which run every chain/devnet test
      # under -race. tests/unit/test_ci_devnet_coverage.py fails if this skip
      # is set while those shards stop covering the package.
      # scripts/run_tests.py also runs the services/broadcaster module, whose
      # PostgreSQL tests need the step above.
      - name: Format, generate, and test
        env:
          SVN_SKIP_DEVNET: "1"
        run: |
          export PATH="${GITHUB_WORKSPACE}/.toolchains/bin:${PATH}"
          bash scripts/gofmt_check.sh
          bash scripts/gen_proto.sh
          untracked="$(git ls-files --others --exclude-standard -- proto/svn proto/gen/python)"
          if [ -n "${untracked}" ]; then
            echo "${untracked}"
            exit 1
          fi
          git diff --exit-code -- proto/svn proto/gen/python
          echo "SVN_SKIP_DEVNET=1: the multi-process chain/devnet tests run in the go-race devnet, devnet-evidence, devnet-upgrade, devnet-broadcaster, devnet-broadcaster-stall, and devnet-indexer shards; TestMilestone runs in the milestone job"
          python3 scripts/run_tests.py --only go
          go vet ./chain/...
          go vet ./proto/...
          go vet ./agents/provider/...
          go vet ./agents/auditor/...
          go vet ./services/broadcaster/...
          go vet -tags svn_faultpoint ./services/broadcaster/...
          go vet -tags svn_roottest ./services/broadcaster/internal/signer/ ./services/broadcaster/internal/keys/
          go test -count=1 -timeout 2m -tags svn_faultpoint ./services/broadcaster/internal/faultpoint/
          go vet ./services/indexer/...
          go vet -tags svn_faultpoint ./services/indexer/...
          go test -count=1 -timeout 2m -tags svn_faultpoint ./services/indexer/internal/faultpoint/
          go vet ./services/api/...
          go vet ./services/scheduler/...
          go vet ./services/milestone/...

  # The race detector run of ./chain/..., ./proto/..., ./agents/provider/...,
  # ./agents/auditor/... and ./services/broadcaster/..., split into eight
  # shards so that each job stays within the 20-minute cap of
  # scripts/workflow_policy.py. chain/app and chain/devnet are the two slowest
  # packages under -race. chain/devnet is split by test name: "devnet-evidence"
  # runs the tests matching TestDevnetAudit (the Goal 09 audit demo, which
  # builds agents/auditor), "devnet-upgrade" the tests matching
  # TestDevnetUpgrade, TestDevnetMinority, or TestDevnetGovernedChange (the
  # Goal 10 upgrade rehearsal, the minority wrong-migration run, and the
  # governed change timing, which build svnd and the rehearsal binaries and
  # call the state-check library), "devnet-broadcaster" the tests matching
  # TestDevnetBroadcasterLifecycle and "devnet-broadcaster-stall" the tests
  # matching TestDevnetBroadcasterQuorumStall (the Goal 11 broadcaster
  # lifecycle and quorum-stall runs, which build svnd and the broadcaster and
  # start PostgreSQL), and "devnet" every other test of the package (its
  # -skip regex is the union of the other four), so the five together run the
  # whole package once. "broadcaster" is the services/broadcaster module,
  # whose tests start PostgreSQL. "rest" is every other ./chain/... package
  # (computed, so a new package lands there) plus ./proto/...,
  # ./agents/provider/... and ./agents/auditor/....
  go-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [app, devnet, devnet-evidence, devnet-upgrade, devnet-broadcaster, devnet-broadcaster-stall, devnet-indexer, broadcaster, indexer, api, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      # The same PostgreSQL 18.6 install as in the go job, for the shards whose
      # tests start PostgreSQL. tests/unit/test_ci_broadcaster.py reads this
      # condition and fails if a shard that runs those tests is missing.
      - name: Install PostgreSQL 18.6
        if: contains(fromJSON('["broadcaster", "devnet-broadcaster", "devnet-broadcaster-stall", "indexer", "devnet-indexer", "api"]'), matrix.shard)
        run: |
          set -euo pipefail
          pg_ver="18.6-1.pgdg24.04+2"
          pg_fpr="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "${key}" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --batch --show-keys --with-colons "${key}" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "${fpr}" != "${pg_fpr}" ]; then
            echo "PostgreSQL apt key fingerprint ${fpr} is not ${pg_fpr}"
            exit 1
          fi
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "${f}" ] && grep -q 'apt.postgresql.org' "${f}"; then
              sudo rm -f "${f}"
            fi
          done
          write_source() {
            printf '%s\n' 'Types: deb' "URIs: $2" "Suites: $3" 'Architectures: amd64' \
              'Components: main' "Signed-By: ${key}" | sudo tee "/etc/apt/sources.list.d/$1.sources" >/dev/null
          }
          has_pin() {
            local found
            found="$(apt-cache madison postgresql-18)"
            awk -F'|' -v want="${pg_ver}" '{ gsub(/[[:space:]]/, "", $2); if ($2 == want) hit = 1 } END { exit hit ? 0 : 1 }' <<<"${found}"
          }
          write_source pgdg https://apt.postgresql.org/pub/repos/apt noble-pgdg
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          if ! has_pin; then
            echo "apt.postgresql.org no longer lists postgresql-18 ${pg_ver}; trying apt-archive.postgresql.org"
            write_source pgdg-archive https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
            if ! has_pin; then
              echo "postgresql-18 ${pg_ver} is in neither PGDG archive; update the pin in docs/dependencies.md, scripts/env/install.sh and this workflow"
              exit 1
            fi
          fi
          created_policy=0
          if [ ! -e /usr/sbin/policy-rc.d ]; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            created_policy=1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "postgresql-18=${pg_ver}" "postgresql-client-18=${pg_ver}"
          if [ "${created_policy}" = 1 ]; then
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          installed="$(dpkg-query -W -f '${Version}' postgresql-18)"
          if [ "${installed}" != "${pg_ver}" ]; then
            echo "installed postgresql-18 ${installed}, want ${pg_ver}"
            exit 1
          fi
          /usr/lib/postgresql/18/bin/postgres --version
      - name: Install pinned FFmpeg
        if: matrix.shard == 'api'
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5
          ffprobe -version
      - name: Race tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mod="github.com/Maxencejules/shortvideo-network"
          case "${SHARD}" in
            app)
              go test -race -count=1 -timeout 12m ./chain/app
              ;;
            devnet)
              # TestDevnetRunsBuiltSvnd builds svnd inside its timeout;
              # building it first fills the build cache.
              go build -C chain -o /dev/null ./cmd/svnd
              go test -race -count=1 -timeout 12m -skip 'TestDevnetAudit|TestDevnetUpgrade|TestDevnetMinority|TestDevnetGovernedChange|TestDevnetBroadcasterLifecycle|TestDevnetBroadcasterQuorumStall|TestDevnetIndexer' ./chain/devnet
              ;;
            devnet-evidence)
              # TestDevnetAuditLifecycle builds agents/auditor with these
              # flags inside its timeout; building it first fills the build
              # cache, so that compile time stays outside the 15m limit.
              go build -C agents/auditor -o /dev/null .
              go test -race -count=1 -timeout 15m -run TestDevnetAudit ./chain/devnet
              ;;
            devnet-upgrade)
              # The upgrade tests build svnd and the rehearsal binaries
              # (-tags svn_rehearsal, -tags svn_rehearsal_bad) inside their
              # timeout and link the state-check library (chain/internal);
              # building them first fills the build cache, so that compile
              # time stays outside the 15m limit.
              go build -C chain -o /dev/null ./cmd/svnd
              go build -C chain -tags svn_rehearsal -o /dev/null ./cmd/svnd
              go build -C chain -tags svn_rehearsal_bad -o /dev/null ./cmd/svnd
              go build -C chain ./internal/...
              go test -race -count=1 -timeout 15m -run 'TestDevnetUpgrade|TestDevnetMinority|TestDevnetGovernedChange' ./chain/devnet
              ;;
            devnet-broadcaster)
              # TestDevnetBroadcasterLifecycle builds svnd, and the
              # broadcaster with -race and -tags svn_faultpoint, inside its
              # timeout; building them first fills the build cache, so that
              # compile time stays outside the 15m limit.
              go build -C chain -o /dev/null ./cmd/svnd
              go build -C services/broadcaster -race -tags svn_faultpoint -o /dev/null ./cmd/svn-broadcaster
              go test -race -count=1 -timeout 15m -run TestDevnetBroadcasterLifecycle ./chain/devnet
              ;;
            devnet-broadcaster-stall)
              # The same prebuilds as devnet-broadcaster, for
              # TestDevnetBroadcasterQuorumStall.
              go build -C chain -o /dev/null ./cmd/svnd
              go build -C services/broadcaster -race -tags svn_faultpoint -o /dev/null ./cmd/svn-broadcaster
              go test -race -count=1 -timeout 12m -run TestDevnetBroadcasterQuorumStall ./chain/devnet
              ;;
            devnet-indexer)
              # TestDevnetIndexer builds svnd and the indexer. Building them
              # first keeps that compile time outside the test timeout.
              go build -C chain -o /dev/null ./cmd/svnd
              go build -C services/indexer -race -tags svn_faultpoint -o /dev/null ./cmd/svn-indexer
              go test -race -count=1 -timeout 12m -run TestDevnetIndexer ./chain/devnet
              ;;
            broadcaster)
              go test -race -count=1 -timeout 12m ./services/broadcaster/...
              ;;
            indexer)
              go test -race -count=1 -timeout 12m ./services/indexer/...
              ;;
            api)
              go test -race -count=1 -timeout 12m ./services/api/...
              ;;
            rest)
              pkgs="$(go list ./chain/... | grep -v -x -e "${mod}/chain/app" -e "${mod}/chain/devnet")"
              if [ -z "${pkgs}" ]; then
                echo "no packages in the rest shard"
                exit 1
              fi
              echo "${pkgs}"
              # shellcheck disable=SC2086
              go test -race -count=1 -timeout 12m ${pkgs}
              go test -race -count=1 -timeout 2m ./proto/...
              go test -race -count=1 -timeout 2m ./agents/provider/...
              go test -race -count=1 -timeout 2m ./agents/auditor/...
              go test -race -count=1 -timeout 8m ./services/scheduler/...
              ;;
            *)
              echo "unknown shard ${SHARD}"
              exit 1
              ;;
          esac

  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build and run the host-network devnet
        run: bash scripts/devnet/prove-containers.sh

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.3"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install protoc and Python dependencies
        run: |
          bash scripts/install_toolchains.sh --protoc-only
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Run specification checkers
        run: |
          export PATH="${GITHUB_WORKSPACE}/.toolchains/bin:${PATH}"
          .venv/bin/python docs/evidence/goal-01/check_requirements.py
          .venv/bin/python docs/evidence/goal-02/check_protocol.py

  # Goal 18. One four-validator devnet, the upload path, and playback, on
  # the runner. The go job sets SVN_SKIP_DEVNET=1, so this job is the run.
  # A skip there is not this result. The install script matches the go job.
  milestone:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.3"
      - name: Install PostgreSQL 18.6
        run: |
          set -euo pipefail
          pg_ver="18.6-1.pgdg24.04+2"
          pg_fpr="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "${key}" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --batch --show-keys --with-colons "${key}" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "${fpr}" != "${pg_fpr}" ]; then
            echo "PostgreSQL apt key fingerprint ${fpr} is not ${pg_fpr}"
            exit 1
          fi
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "${f}" ] && grep -q 'apt.postgresql.org' "${f}"; then
              sudo rm -f "${f}"
            fi
          done
          write_source() {
            printf '%s\n' 'Types: deb' "URIs: $2" "Suites: $3" 'Architectures: amd64' \
              'Components: main' "Signed-By: ${key}" | sudo tee "/etc/apt/sources.list.d/$1.sources" >/dev/null
          }
          has_pin() {
            local found
            found="$(apt-cache madison postgresql-18)"
            awk -F'|' -v want="${pg_ver}" '{ gsub(/[[:space:]]/, "", $2); if ($2 == want) hit = 1 } END { exit hit ? 0 : 1 }' <<<"${found}"
          }
          write_source pgdg https://apt.postgresql.org/pub/repos/apt noble-pgdg
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          if ! has_pin; then
            echo "apt.postgresql.org no longer lists postgresql-18 ${pg_ver}; trying apt-archive.postgresql.org"
            write_source pgdg-archive https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
            if ! has_pin; then
              echo "postgresql-18 ${pg_ver} is in neither PGDG archive; update the pin in docs/dependencies.md, scripts/env/install.sh and this workflow"
              exit 1
            fi
          fi
          created_policy=0
          if [ ! -e /usr/sbin/policy-rc.d ]; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            created_policy=1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "postgresql-18=${pg_ver}" "postgresql-client-18=${pg_ver}"
          if [ "${created_policy}" = 1 ]; then
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          installed="$(dpkg-query -W -f '${Version}' postgresql-18)"
          if [ "${installed}" != "${pg_ver}" ]; then
            echo "installed postgresql-18 ${installed}, want ${pg_ver}"
            exit 1
          fi
          /usr/lib/postgresql/18/bin/postgres --version
      - name: Install pinned FFmpeg
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5
          ffprobe -version
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Run the milestone scenario
        env:
          SVN_MILESTONE_PATH: ${{ github.workspace }}/.venv/bin
        run: |
          go build -C chain -o /dev/null ./cmd/svnd
          go build -C agents/provider -o /dev/null ./cmd/svn-provider
          go build -C services/broadcaster -o /dev/null ./cmd/svn-broadcaster
          go build -C services/indexer -o /dev/null ./cmd/svn-indexer
          go build -C services/api -o /dev/null ./cmd/svn-api
          go build -C services/scheduler -o /dev/null ./cmd/svn-scheduler
          go build -C services/milestone -o /dev/null ./cmd/svn-chainview
          go test -count=1 -timeout 15m -run TestMilestone ./services/milestone/
