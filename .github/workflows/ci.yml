# Continuous integration for the skeleton.
# contents: read is the only permission. The workflow does not receive
# repository credentials, does not merge, and does not publish an image.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.3"
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Format, lint, types, unit tests, secret scan
        run: |
          .venv/bin/ruff format --check services workers/media packages/protocol tests scripts
          .venv/bin/ruff check services workers/media packages/protocol tests scripts
          .venv/bin/mypy
          .venv/bin/python scripts/workflow_policy.py
          .venv/bin/python scripts/scan_secrets.py
          .venv/bin/python scripts/write_sbom.py --check
          .venv/bin/python scripts/run_tests.py --only python

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
      - name: Install, type-check, and test
        run: |
          npm ci
          npm run typecheck
          python3 scripts/run_tests.py --only node

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install protoc
        run: bash scripts/install_toolchains.sh --protoc-only
      # SVN_SKIP_DEVNET=1 skips the multi-process chain/devnet tests in this
      # job. Without -race they take about 9.5 minutes, plus up to about 6.5
      # minutes when TestDevnetAuditLifecycle waits for an audit round
      # boundary, which can reach the 20-minute job cap, and they would only
      # repeat the go-race "devnet" and "devnet-evidence" shards, which run
      # every chain/devnet test under -race. tests/unit/test_ci_devnet_coverage.py
      # fails if this skip is set while those shards stop covering the package.
      - name: Format, generate, and test
        env:
          SVN_SKIP_DEVNET: "1"
        run: |
          export PATH="${GITHUB_WORKSPACE}/.toolchains/bin:${PATH}"
          bash scripts/gofmt_check.sh
          bash scripts/gen_proto.sh
          untracked="$(git ls-files --others --exclude-standard -- proto/svn proto/gen/python)"
          if [ -n "${untracked}" ]; then
            echo "${untracked}"
            exit 1
          fi
          git diff --exit-code -- proto/svn proto/gen/python
          echo "SVN_SKIP_DEVNET=1: the multi-process chain/devnet tests run in the go-race devnet and devnet-evidence shards"
          python3 scripts/run_tests.py --only go
          go vet ./chain/...
          go vet ./proto/...
          go vet ./agents/provider/...
          go vet ./agents/auditor/...

  # The race detector run of ./chain/..., ./proto/..., ./agents/provider/...
  # and ./agents/auditor/... with the same flags as before, split into four
  # shards so that each job stays within the 20-minute cap of
  # scripts/workflow_policy.py. chain/app and chain/devnet are the two slowest
  # packages under -race. chain/devnet is split by test name: "devnet-evidence"
  # runs the tests matching TestDevnetAudit (the Goal 09 audit demo, which
  # builds agents/auditor) and "devnet" every other test of the package, so the
  # two together run the whole package once. "rest" is every other ./chain/...
  # package (computed, so a new package lands there) plus ./proto/...,
  # ./agents/provider/... and ./agents/auditor/....
  go-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [app, devnet, devnet-evidence, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Race tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mod="github.com/Maxencejules/shortvideo-network"
          case "${SHARD}" in
            app)
              go test -race -count=1 -timeout 12m ./chain/app
              ;;
            devnet)
              go test -race -count=1 -timeout 12m -skip TestDevnetAudit ./chain/devnet
              ;;
            devnet-evidence)
              # TestDevnetAuditLifecycle builds agents/auditor with these
              # flags inside its timeout; building it first fills the build
              # cache, so that compile time stays outside the 15m limit.
              go build -C agents/auditor -o /dev/null .
              go test -race -count=1 -timeout 15m -run TestDevnetAudit ./chain/devnet
              ;;
            rest)
              pkgs="$(go list ./chain/... | grep -v -x -e "${mod}/chain/app" -e "${mod}/chain/devnet")"
              if [ -z "${pkgs}" ]; then
                echo "no packages in the rest shard"
                exit 1
              fi
              echo "${pkgs}"
              # shellcheck disable=SC2086
              go test -race -count=1 -timeout 12m ${pkgs}
              go test -race -count=1 -timeout 2m ./proto/...
              go test -race -count=1 -timeout 2m ./agents/provider/...
              go test -race -count=1 -timeout 2m ./agents/auditor/...
              ;;
            *)
              echo "unknown shard ${SHARD}"
              exit 1
              ;;
          esac

  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build and run the host-network devnet
        run: bash scripts/devnet/prove-containers.sh

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.3"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install protoc and Python dependencies
        run: |
          bash scripts/install_toolchains.sh --protoc-only
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Run specification checkers
        run: |
          export PATH="${GITHUB_WORKSPACE}/.toolchains/bin:${PATH}"
          .venv/bin/python docs/evidence/goal-01/check_requirements.py
          .venv/bin/python docs/evidence/goal-02/check_protocol.py
