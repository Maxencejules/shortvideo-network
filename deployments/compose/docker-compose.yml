# Full Linux profile for a host that has a container runtime.
# Image digests were read from registry-1.docker.io on 2026-10-31.
# linux/amd64 manifest digests only. They are not the multi-arch index.
# A host of another architecture cannot use these digests as-is.
# This file has no passwords. scripts/env/compose.sh supplies them from the
# disposable workspace and refuses to start when docker is unavailable.
services:
  postgres:
    image: postgres:18.6@sha256:f4b419e350fd98d4a8429603295208976dea4c8fb8326d818d346d3e29f1db6f
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18 keeps PGDATA at /var/lib/postgresql/18/docker. Mounting
      # /var/lib/postgresql/data makes the entrypoint exit 1.
      - svn_dev_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management@sha256:9f48a2c0a501c5a7cf520d69eb3369ba85e614a195dde071f3dfa20077e54d26
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - svn_dev_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  svn_dev_postgres:
  svn_dev_rabbitmq:
