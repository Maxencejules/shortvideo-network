syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// DEC-001 through DEC-008 are OPEN. No field below approves them.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.authority.v1;

import "svn/types/v1/types.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/authority/v1;authorityv1";

// ProposalState. Council voting is not CometBFT consensus voting.
enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_OPEN = 1;
  PROPOSAL_STATE_QUEUED = 2;
  PROPOSAL_STATE_EXECUTED = 3;
  PROPOSAL_STATE_EXPIRED = 4;
  PROPOSAL_STATE_REJECTED = 5;
}

// QuorumLossBehavior stays UNSET while DEC-008 is OPEN.
enum QuorumLossBehavior {
  QUORUM_LOSS_BEHAVIOR_UNSPECIFIED = 0;
  QUORUM_LOSS_BEHAVIOR_UNSET = 1;
  reserved 2, 3, 4;
  reserved "QUORUM_LOSS_BEHAVIOR_ELECTED", "QUORUM_LOSS_BEHAVIOR_FREEZE", "QUORUM_LOSS_BEHAVIOR_ROOT";
}

message ValidatorPower {
  // bound: consensus_pubkey_bytes=32
  bytes consensus_pubkey = 1;
  int64 power = 2;
  string node_id = 3;
}

message DevnetTestSeat {
  string seat_id = 1;
  // bound: ed25519_public_bytes=32
  bytes public_key = 2;
}

message Proposal {
  string proposal_id = 1;
  string parameter_key = 2;
  uint64 base_policy_version = 3;
  svn.types.v1.Digest payload_digest = 4;
  ProposalState state = 5;
  int64 expiry_unix_seconds = 6;
  int64 execute_after_unix_seconds = 7;
  repeated bytes approver_keys = 8;
  string business_id = 9;
}

message AuthorityState {
  repeated ValidatorPower validators = 1;
  repeated svn.types.v1.Submitter submitters = 2;
  repeated Proposal proposals = 3;
  // Approved seats are empty while DEC-008 is OPEN.
  repeated DevnetTestSeat approved_council = 4;
  repeated DevnetTestSeat devnet_test_seats = 5;
  QuorumLossBehavior quorum_loss = 6;
}
