syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// Gate A approved DEC-001 through DEC-012. No field below sets an on-chain approved flag.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.authority.v1;

import "svn/types/v1/types.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/authority/v1;authorityv1";

// Governance messages. Threshold, delay, expiry, and seats are DEC-008.
// ExecuteChange fails closed with ERROR_CODE_DECISION_BLOCKED when that
// parameter is unapproved and devnet test parameters are not enabled.
// There is no MsgCreateValidator in this protocol.

// Allowed governance effects. ExecuteChange applies exactly one of these,
// except ValidatorPowerChange, which it schedules. The digest is SHA-256
// over SVN-JCS-1 of the proto3 JSON object defined in docs/protocol.md.
// A digest that does not match the payload is rejected. There is no
// google.protobuf.Any wrapper.

// ActivationPoint is a committed height or a committed chain time.
// ExecuteChange requires it to be strictly after the execution context.
// No council delay number is chosen here. DEC-008 stays open.
message ActivationPoint {
  oneof point {
    int64 unix_seconds = 1;
    uint64 height = 2;
  }
}

message ValidatorPowerChange {
  // bound: consensus_pubkey_bytes=32
  bytes consensus_pubkey = 1;
  // Zero removes that validator. The resulting set must keep positive power.
  int64 power = 2;
  string node_id = 3;
  svn.types.v1.Digest reason_digest = 4;
  ActivationPoint activation = 5;
}

message GovernedLimitChange {
  string limit_key = 1;
  uint64 value = 2;
}

message AdmitProviderChange {
  string provider_id = 1;
}

message DisableProviderChange {
  string provider_id = 1;
}

message ForceWithdrawChange {
  string content_id = 1;
  uint64 content_version = 2;
  svn.types.v1.Digest reason_digest = 3;
}

message ProposalPayload {
  oneof change {
    ValidatorPowerChange validator_power = 1;
    GovernedLimitChange governed_limit = 2;
    AdmitProviderChange admit_provider = 3;
    DisableProviderChange disable_provider = 4;
    ForceWithdrawChange force_withdraw = 5;
  }
}

message MsgProposeChange {
  bytes signer = 1;
  string business_id = 2;
  string proposal_id = 3;
  string parameter_key = 4;
  uint64 base_policy_version = 5;
  ProposalPayload payload = 6;
  svn.types.v1.Digest payload_digest = 7;
  int64 expiry_unix_seconds = 8;
}

message MsgApproveChange {
  bytes signer = 1;
  string business_id = 2;
  string proposal_id = 3;
}

message MsgExecuteChange {
  bytes signer = 1;
  string business_id = 2;
  string proposal_id = 3;
}

service Msg {
  rpc ProposeChange(MsgProposeChange) returns (MsgProposeChangeResponse);
  rpc ApproveChange(MsgApproveChange) returns (MsgApproveChangeResponse);
  rpc ExecuteChange(MsgExecuteChange) returns (MsgExecuteChangeResponse);
}

message MsgProposeChangeResponse {}
message MsgApproveChangeResponse {}
message MsgExecuteChangeResponse {}
