syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// DEC-001 through DEC-008 are OPEN. No field below approves them.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.content.v1;

import "svn/content/v1/state.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/content/v1;contentv1";

message QueryContentRequest {
  string content_id = 1;
  uint64 content_version = 2;
}

message QueryContentResponse {
  Content content = 1;
  Tombstone tombstone = 2;
}

service Query {
  rpc Content(QueryContentRequest) returns (QueryContentResponse);
}
