syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// Gate A approved DEC-001 through DEC-012. No field below sets an on-chain approved flag.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.content.v1;

import "svn/types/v1/types.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/content/v1;contentv1";

message MsgRegisterContent {
  bytes signer = 1;
  string business_id = 2;
  string content_id = 3;
  uint64 content_version = 4;
  svn.types.v1.Digest manifest_digest = 5;
  uint64 package_bytes = 6;
  svn.types.v1.InnerSignature hosting_intent = 7;
}

message MsgWithdrawContent {
  bytes signer = 1;
  string business_id = 2;
  string content_id = 3;
  uint64 content_version = 4;
  svn.types.v1.Digest reason_digest = 5;
  svn.types.v1.InnerSignature hosting_intent = 6;
}

service Msg {
  rpc RegisterContent(MsgRegisterContent) returns (MsgRegisterContentResponse);
  rpc WithdrawContent(MsgWithdrawContent) returns (MsgWithdrawContentResponse);
}

message MsgRegisterContentResponse {}
message MsgWithdrawContentResponse {}
