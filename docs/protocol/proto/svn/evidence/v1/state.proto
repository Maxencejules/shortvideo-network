syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// DEC-001 through DEC-008 are OPEN. No field below approves them.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.evidence.v1;

import "svn/types/v1/types.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/evidence/v1;evidencev1";

// EvidenceKind is an attestation class. Storage-proof kinds are reserved
// and rejected. A recorded item is not proof of independent storage,
// unique replication, legality, or future delivery.
enum EvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_PROVIDER_RECEIPT = 1;
  EVIDENCE_KIND_AUDITOR_ATTESTATION = 2;
  reserved 3, 4, 5;
  reserved "EVIDENCE_KIND_STORAGE_PROOF", "EVIDENCE_KIND_UNIQUE_REPLICA_PROOF", "EVIDENCE_KIND_FUTURE_DELIVERY";
}

enum EvidenceState {
  EVIDENCE_STATE_UNSPECIFIED = 0;
  EVIDENCE_STATE_RECORDED = 1;
  EVIDENCE_STATE_EXPIRED = 2;
  EVIDENCE_STATE_REJECTED = 3;
}

message EvidenceRecord {
  string evidence_id = 1;
  string batch_id = 2;
  EvidenceKind kind = 3;
  EvidenceState state = 4;
  bytes signer_pubkey = 5;
  string lease_id = 6;
  string content_id = 7;
  uint64 content_version = 8;
  svn.types.v1.Digest observation_digest = 9;
  uint64 epoch = 10;
  int64 expiry_unix_seconds = 11;
  uint32 schema_version = 12;
  bool attestation = 13;
}
