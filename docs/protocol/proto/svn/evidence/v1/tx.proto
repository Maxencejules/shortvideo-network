syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// DEC-001 through DEC-008 are OPEN. No field below approves them.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.evidence.v1;

import "svn/types/v1/types.proto";
import "svn/evidence/v1/state.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/evidence/v1;evidencev1";

message EvidenceItem {
  string evidence_id = 1;
  EvidenceKind kind = 2;
  string lease_id = 3;
  string content_id = 4;
  uint64 content_version = 5;
  svn.types.v1.Digest observation_digest = 6;
  int64 expiry_unix_seconds = 7;
  bool attestation = 8;
  // When true the recorded state is REJECTED. The item is still an attestation.
  bool reject = 9;
}

message MsgSubmitAuditBatch {
  bytes signer = 1;
  string business_id = 2;
  string batch_id = 3;
  uint64 epoch = 4;
  uint32 schema_version = 5;
  // bound: safety_max_evidence_batch=32
  repeated EvidenceItem items = 6;
  svn.types.v1.InnerSignature auditor_signature = 7;
}

service Msg {
  rpc SubmitAuditBatch(MsgSubmitAuditBatch) returns (MsgSubmitAuditBatchResponse);
}

message MsgSubmitAuditBatchResponse {}
