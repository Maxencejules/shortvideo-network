syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// Gate A approved DEC-001 through DEC-012. No field below sets an on-chain approved flag.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.leases.v1;

import "svn/types/v1/types.proto";
import "svn/leases/v1/state.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/leases/v1;leasesv1";

message QueryActiveLeasesRequest {
  string content_id = 1;
  string provider_id = 2;
  svn.types.v1.PageRequest page = 3;
}

message QueryActiveLeasesResponse {
  repeated Lease leases = 1;
  svn.types.v1.PageResponse page = 2;
}

message QueryDeadlinesRequest {
  int64 not_after_unix_seconds = 1;
  svn.types.v1.PageRequest page = 2;
}

message QueryDeadlinesResponse {
  repeated Lease leases = 1;
  repeated Offer offers = 2;
  svn.types.v1.PageResponse page = 3;
}

service Query {
  rpc ActiveLeases(QueryActiveLeasesRequest) returns (QueryActiveLeasesResponse);
  rpc Deadlines(QueryDeadlinesRequest) returns (QueryDeadlinesResponse);
}
