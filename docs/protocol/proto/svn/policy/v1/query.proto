syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// DEC-001 through DEC-008 are OPEN. No field below approves them.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.policy.v1;

import "svn/policy/v1/state.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/policy/v1;policyv1";

message QueryPolicyRequest {}

message QueryPolicyResponse {
  PolicyState state = 1;
}

service Query {
  rpc Policy(QueryPolicyRequest) returns (QueryPolicyResponse);
}
