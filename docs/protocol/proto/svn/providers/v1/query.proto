syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// DEC-001 through DEC-008 are OPEN. No field below approves them.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.providers.v1;

import "svn/types/v1/types.proto";
import "svn/providers/v1/state.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/providers/v1;providersv1";

message QueryProviderRequest {
  string provider_id = 1;
}

message QueryProviderResponse {
  Provider provider = 1;
}

message QueryProvidersRequest {
  svn.types.v1.PageRequest page = 1;
}

message QueryProvidersResponse {
  repeated Provider providers = 1;
  svn.types.v1.PageResponse page = 2;
}

service Query {
  rpc Provider(QueryProviderRequest) returns (QueryProviderResponse);
  rpc Providers(QueryProvidersRequest) returns (QueryProvidersResponse);
}
