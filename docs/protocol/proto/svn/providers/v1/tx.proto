syntax = "proto3";

// Draft protocol v0 types for the permissioned beta.
// Frozen-pending-Gate-A. Not an approved protocol. Public launch: DISABLED.
// Gate A approved DEC-001 through DEC-012. No field below sets an on-chain approved flag.
// No video bytes, personal data, token, mint, distribution, or slashing.

package svn.providers.v1;

import "svn/types/v1/types.proto";

option go_package = "github.com/Maxencejules/shortvideo-network/protocol/svn/providers/v1;providersv1";

message MsgRegisterProvider {
  bytes signer = 1;
  string business_id = 2;
  string provider_id = 3;
  bytes signing_pubkey = 4;
  string signing_key_id = 5;
  svn.types.v1.Digest endpoint_manifest_digest = 6;
  uint64 declared_capacity_bytes = 7;
  string operator_group_id = 8;
}

message MsgUpdateProvider {
  bytes signer = 1;
  string business_id = 2;
  string provider_id = 3;
  svn.types.v1.Digest endpoint_manifest_digest = 4;
  uint64 declared_capacity_bytes = 5;
}

message MsgRotateProviderKey {
  bytes signer = 1;
  string business_id = 2;
  string provider_id = 3;
  bytes new_signing_pubkey = 4;
  string new_signing_key_id = 5;
  uint64 expected_generation = 6;
  svn.types.v1.InnerSignature current_key_signature = 7;
}

message MsgDrainProvider {
  bytes signer = 1;
  string business_id = 2;
  string provider_id = 3;
  svn.types.v1.InnerSignature provider_signature = 4;
}

service Msg {
  rpc RegisterProvider(MsgRegisterProvider) returns (MsgRegisterProviderResponse);
  rpc UpdateProvider(MsgUpdateProvider) returns (MsgUpdateProviderResponse);
  rpc RotateProviderKey(MsgRotateProviderKey) returns (MsgRotateProviderKeyResponse);
  rpc DrainProvider(MsgDrainProvider) returns (MsgDrainProviderResponse);
}

message MsgRegisterProviderResponse {}
message MsgUpdateProviderResponse {}
message MsgRotateProviderKeyResponse {}
message MsgDrainProviderResponse {}
