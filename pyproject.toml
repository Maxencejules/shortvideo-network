[project]
name = "shortvideo-network-dev"
version = "0.0.0"
description = "Development dependencies for the shortvideo-network skeleton. Not a published application."
requires-python = ">=3.12.3,<3.13"
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "jsonschema==4.26.0",
  "protobuf==7.36.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pip-tools==7.6.2",
  "pytest==9.2.0",
  "pyyaml==6.0.3",
  "ruff==0.17.3",
  "types-PyYAML==6.0.12.20261030",
  "types-jsonschema==4.26.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --tb=short"
pythonpath = [
  "services/api",
  "services/indexer",
  "services/broadcaster",
  "workers/media",
  "packages/protocol",
  "proto/gen/python",
]

[tool.ruff]
line-length = 100
src = ["services", "workers", "packages/protocol", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["services", "workers/media", "packages/protocol", "tests/unit", "scripts"]
mypy_path = "services/api:services/indexer:services/broadcaster:workers/media:packages/protocol:proto/gen/python"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "svn.*"
ignore_errors = true
